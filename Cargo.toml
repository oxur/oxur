[workspace]
resolver = "2"
members = [
    "crates/oxur",
    "crates/oxur-odm",
    "crates/oxur-ast",
    "crates/oxur-lang",
    "crates/oxur-comp",
    "crates/oxur-repl",
    "crates/oxur-cli",
    "crates/oxur-pretty",
    "crates/oxur-smap",
    "crates/oxur-testing",
    "crates/cargo-oxur",
]

# Workspace-wide dependencies (shared versions)
[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
regex = "1.10"
sha2 = "0.10"
colored = "2.1"
unicode-normalization = "0.1"
glob = "0.3"
proptest = "1.4"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
cargo-llvm-cov = "0.6"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
fs2 = "0.4"
serial_test = "3.2"
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
criterion = "0.5"
tabled = "0.17"

# Package metadata shared by all crates
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Duncan McGreggor <duncan@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxur/oxur"
