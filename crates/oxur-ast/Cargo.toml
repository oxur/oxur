[package]
name = "oxur-ast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust AST ↔ S-expression conversion for Oxur"

# Binary configuration (following oxd pattern)
[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
# Phase 3: Integration with Rust's parser
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
prettyplease = "0.2"
# Phase 3: CLI dependencies
clap.workspace = true
anyhow.workspace = true
oxur-cli = { path = "../oxur-cli" }
# Keep colored for some specific formatting (e.g., file names in verify)
colored.workspace = true

[dev-dependencies]
tempfile = "3.8"
# Phase 3: Benchmarking
criterion = "0.5"

[[bench]]
name = "conversion_bench"
harness = false
