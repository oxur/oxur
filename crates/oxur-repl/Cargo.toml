[package]
name = "oxur-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Oxur REPL: protocol, client, and server with tiered execution"

[dependencies]
oxur-lang = { path = "../oxur-lang" }
oxur-comp = { path = "../oxur-comp" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
async-trait = "0.1"

[dev-dependencies]
anyhow.workspace = true
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
