[package]
name = "oxur-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Oxur REPL: protocol, client, and server with tiered execution"

[dependencies]
oxur-smap = { path = "../oxur-smap" }
oxur-lang = { version = "0.1.0", path = "../oxur-lang" }
oxur-comp = { version = "0.1.0", path = "../oxur-comp" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
async-trait = "0.1"
# Required for Phase 0+ implementation (per ENHANCEMENT_PLAN.md)
sha2 = "0.10"          # SHA256 for content-addressed cache keys
dirs = "5.0"           # Cache directory discovery
libloading = "0.8"     # Dynamic library loading in subprocess
which = "6.0"          # Finding subprocess binary in PATH
# Required for Phase 7: Type Inference
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"

[dev-dependencies]
anyhow.workspace = true
tokio = { version = "1.0", features = ["rt", "macros", "time"] }

# Binary target for subprocess execution (ODD-0026 Section 3.3)
[[bin]]
name = "oxur-repl-subprocess"
path = "src/bin/subprocess.rs"
