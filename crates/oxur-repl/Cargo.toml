[package]
name = "oxur-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Oxur REPL: protocol, client, and server with tiered execution"

[dependencies]
oxur-smap = { version = "0.2.0", path = "../oxur-smap" }
oxur-lang = { version = "0.2.0", path = "../oxur-lang" }
oxur-comp = { version = "0.2.0", path = "../oxur-comp" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
async-trait = "0.1"
# Required for Phase 0+ implementation (per ENHANCEMENT_PLAN.md)
sha2 = "0.10"          # SHA256 for content-addressed cache keys
dirs = "5.0"           # Cache directory discovery
libloading = "0.8"     # Dynamic library loading in subprocess
which = "6.0"          # Finding subprocess binary in PATH
fs2.workspace = true   # Cross-platform file locking for cache index
sysinfo = "0.30"       # Process memory tracking for stats
# Required for Phase 7: Type Inference
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
# Required for Phase 4: Source Map Integration
ariadne = "0.4"          # Beautiful error display (rustc-style)
regex = "1.10"           # Parse /* oxur_node=N */ comments
# Metrics system (ODD-pending: REPL Metrics)
# Stats are exposed via REPL protocol (postcard-encoded) - no external exporters needed
metrics = "0.24"                 # Metrics facade (counter!, gauge!, histogram!)
metrics-process = "2.1"          # Process-level metrics (memory, CPU, FDs)

[dev-dependencies]
anyhow.workspace = true
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
oxur-testing = { version = "0.2.0", path = "../oxur-testing" }
tempfile.workspace = true
criterion.workspace = true
serial_test.workspace = true

# Binary target for subprocess execution (ODD-0026 Section 3.3)
[[bin]]
name = "oxur-repl-subprocess"
path = "src/bin/subprocess.rs"

# Benchmarks for three-tier execution (ODD-0038 §2.3)
[[bench]]
name = "execution_tiers"
harness = false
