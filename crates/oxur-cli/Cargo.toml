[package]
name = "oxur-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI infrastructure and unified command-line tool for Oxur"

# Binary configuration - the unified `oxur` tool
[[bin]]
name = "oxur"
path = "src/main.rs"

# Library configuration - common utilities for all Oxur CLIs
[lib]
name = "oxur_cli"
path = "src/lib.rs"

[dependencies]
# For library utilities
tabled = "0.17"
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }


# For binary (when building the oxur command)
oxur-lang = { version = "0.1.0", path = "../oxur-lang", optional = true }
oxur-comp = { version = "0.1.0", path = "../oxur-comp", optional = true }
oxur-repl = { version = "0.1.0", path = "../oxur-repl", optional = true }
clap = { workspace = true, optional = true }

# For REPL terminal interface
reedline = { version = "0.44", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
terminal_size = { version = "0.3", optional = true }
crossterm = { version = "0.28", optional = true }
dirs = { version = "5.0", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
# Metrics system (ODD-pending: REPL Metrics)
metrics = { version = "0.24", optional = true }

[features]
default = ["binary"]
# Feature for the binary (not needed by library users)
binary = ["clap", "oxur-lang", "oxur-comp", "oxur-repl", "reedline", "nu-ansi-term", "terminal_size", "crossterm", "dirs", "tokio", "async-trait", "metrics"]

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
