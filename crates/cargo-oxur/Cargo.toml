[package]
name = "cargo-oxur"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo subcommand for building Oxur Lisp projects"
keywords = ["cargo-subcommand", "lisp", "oxur", "compiler"]
categories = ["development-tools::cargo-plugins", "compilers"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
cargo_metadata = "0.18"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
walkdir = "2.4"

oxur-comp = { version = "0.2.0", path = "../oxur-comp" }
oxur-lang = { version = "0.2.0", path = "../oxur-lang" }
oxur-cli = { version = "0.2.0", path = "../oxur-cli", features = ["binary"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile.workspace = true
